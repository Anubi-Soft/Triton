<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damas Retro</title>
    <!-- CSS Global + CSS Específico del Juego -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/checkers.css">
</head>
<body>

    <div class="game-layout">
        <!-- Columna Izquierda: Juego y Selección de Modo -->
        <div class="card compact-card text-center">
            <h2>Damas Retro 🔴⚪</h2>
            
            <!-- Contenedor donde se inyecta el selector universal -->
            <div id="mode-selector-container"></div>

            <p id="game-status" style="margin: 6px 0; font-weight: bold;">Turno de: Rojas</p>
            
            <!-- Checkbox de regla personalizada -->
            <div class="rules-option">
                <input type="checkbox" id="allow-orthogonal" onchange="toggleOrthogonalRules(this.checked)">
                <label for="allow-orthogonal">Habilitar mov. recto (Rey Arcade/Chinas)</label>
            </div>

            <!-- Contenedor con pilas de fichas comidas a los laterales -->
            <div class="board-container">
                <div id="captured-red" class="captured-stack" title="Rojas comidas"></div>
                <div id="checkers-board"></div>
                <div id="captured-black" class="captured-stack" title="Negras comidas"></div>
            </div>
            
            <button class="btn-reset" onclick="window.onStartUser ? window.onStartUser() : initCheckers()" style="padding: 4px 12px; margin-top: 5px;">Reiniciar Partida</button>
        </div>

        <!-- Columna Derecha: Chat con AnubiBot -->
        <div class="card compact-card">
            <h3 style="color: var(--accent-color);">💬 Chat con AnubiBot</h3>
            
            <div style="margin: 5px 0; display: flex; align-items: center; gap: 6px;">
                <label for="player-name" class="label-sm">Nick: </label>
                <input type="text" id="player-name" class="select-style" style="width: 100%; text-align: left;" value="Jugador">
            </div>

            <div id="chat-history" class="chat-history-box">
                <div><strong style="color: var(--accent-color);">AnubiBot:</strong> ¡Bienvenido a Damas! 🎲 Elegí el modo y arrancamos.</div>
            </div>

            <div style="display: flex; gap: 6px;">
                <input type="text" id="chat-input" class="select-style" placeholder="Escribe un mensaje..." style="flex: 1; text-align: left;" onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="btn-reset" style="padding: 4px 10px; margin: 0;">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Scripts de Modos, Chat y Lógica -->
    <script src="../js/frameworks/games/mode-manager.js"></script>
    <script src="../js/frameworks/games/game-actions.js"></script>
    <script src="../js/frameworks/games/game-logic.js"></script>
    <script src="../js/games/checkers.js"></script>
  
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.GameModeManager) {
                GameModeManager.renderSelector('mode-selector-container');
            }
        });
    </script>
</body>
</html>
