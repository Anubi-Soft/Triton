<!-- Dentro de games.html -->
<div id="app-drawer" class="app-drawer">
    <h3 class="drawer-title">🎮 Galería de Minijuegos</h3>
    <div class="games-grid">
        
        <!-- Tarjeta 1: Ta-Te-Ti -->
        <button id="btn-tateti" class="game-card" data-game-url="games/tateti.html" onclick="window.launchGame('games/tateti.html')">
            <div class="game-icon">❌⭕</div>
            <span>Ta-Te-Ti AI</span>
        </button>

        <!-- Tarjeta 2: Damas Retro -->
        <button id="btn-checkers" class="game-card" data-game-url="games/checkers.html" onclick="window.launchGame('games/checkers.html')">
            <div class="game-icon">⚪🔴</div>
            <span>Damas Retro</span>
        </button>

    </div>
</div>


<div class="game-viewport">
    <button id="btn-back" class="btn-retro-back hidden" type="button">
        ⬅️ Volver al Menú
    </button>
    <iframe id="game-frame" class="game-frame hidden" src="about:blank"></iframe>
</div>
