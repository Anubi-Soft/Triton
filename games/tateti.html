<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ta-Te-Ti Retro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="game-layout">
        <!-- Columna Izquierda: Controles y Tablero -->
        <div class="card compact-card text-center" style="padding: 12px;">
            <h2>Ta-Te-Ti Retro 🎮</h2>

            <!-- Selector de Modos -->
            <div id="mode-selector-container"></div>

            <p id="game-status" style="margin: 6px 0; font-weight: bold;">Turno de: Jugador (X)</p>

            <!-- Tablero 3x3 -->
            <div class="board" id="board" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 240px; margin: 10px auto;">
                <button class="cell" onclick="makeMove(0)"></button>
                <button class="cell" onclick="makeMove(1)"></button>
                <button class="cell" onclick="makeMove(2)"></button>
                <button class="cell" onclick="makeMove(3)"></button>
                <button class="cell" onclick="makeMove(4)"></button>
                <button class="cell" onclick="makeMove(5)"></button>
                <button class="cell" onclick="makeMove(6)"></button>
                <button class="cell" onclick="makeMove(7)"></button>
                <button class="cell" onclick="makeMove(8)"></button>
            </div>

            <button class="btn-reset" onclick="resetGame()" style="padding: 4px 12px; margin-top: 5px;">Reiniciar Partida</button>
        </div>

        <!-- Columna Derecha: Chat Universal -->
        <div class="card compact-card" style="padding: 12px;">
            <h3 style="color: var(--accent-color, #00ffcc);">💬 Chat con AnubiBot</h3>

            <div style="margin: 5px 0; display: flex; align-items: center; gap: 6px;">
                <label for="player-name" class="label-sm">Nick: </label>
                <input type="text" id="player-name" class="select-style" style="width: 100%; text-align: left;" value="Jugador">
            </div>

            <div id="chat-history" style="height: 140px; overflow-y: auto; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px; text-align: left; font-size: 0.85rem; margin-bottom: 8px;">
                <div><strong style="color: #00A2ED;">AnubiBot:</strong> ¡Bienvenido a Ta-Te-Ti! 🎲 Elegí el modo y arrancamos.</div>
            </div>

            <div style="display: flex; gap: 6px;">
                <input type="text" id="chat-input" class="select-style" placeholder="Escribe un mensaje..." style="flex: 1; text-align: left;" onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="btn-reset" style="padding: 4px 10px; margin: 0;">Enviar</button>
            </div>
        </div>
    </div>

    <!-- 1. Framework & Core (Directorio raíz /js/) -->
    <script src="../js/frameworks/games/mode-manager.js"></script>
    <script src="../js/frameworks/games/game-actions.js"></script>
    <script src="../js/frameworks/games/game-logic.js"></script>
    <script src="../js/frameworks/games/ia-engine.js"></script>
    <!-- 2. Lógica Específica del Juego (Subdirectorio /js/games/) -->
    <script src="../js/games/tateti.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            GameModeManager.renderSelector('mode-selector-container');
        });
    </script>
</body>
</html>
