<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damas Retro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { background: transparent; padding: 5px; margin: 0; }
        
        .game-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .game-layout { grid-template-columns: 1fr 1fr; align-items: start; }
        }

        /* Tablero Damas 8x8 */
        #checkers-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 280px;
            height: 280px;
            margin: 10px auto;
            border: 2px solid var(--accent-color, #00ffcc);
            border-radius: 4px;
        }

        .square {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square.dark { background: rgba(0,0,0,0.5); }
        .square.light { background: rgba(255,255,255,0.1); }

        .piece {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .piece-r { background: #ff4444; }
        .piece-b { background: #333; }
        .piece.selected { border-color: #00ffcc; box-shadow: 0 0 8px #00ffcc; }

        @media (max-width: 768px) {
            #checkers-board { width: 240px; height: 240px; }
            .square { width: 30px; height: 30px; }
            .piece { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

    <div class="game-layout">
        <!-- Tablero de Damas -->
        <div class="card compact-card text-center" style="padding: 12px;">
            <h2>Damas Retro 🔴⚪</h2>
            <p id="game-status" style="margin: 4px 0; font-weight: bold;">Turno de: Rojas</p>
            
            <div id="checkers-board"></div>
            
            <button class="btn-reset" onclick="initCheckers()" style="padding: 4px 12px; margin-top: 5px;">Reiniciar Partida</button>
        </div>

        <!-- Chat con AnubiBot -->
        <div class="card compact-card" style="padding: 12px;">
            <h3 style="color: var(--accent-color, #00ffcc);">💬 Chat con AnubiBot</h3>
            
            <div style="margin: 5px 0; display: flex; align-items: center; gap: 6px;">
                <label for="player-name" class="label-sm">Nick: </label>
                <input type="text" id="player-name" class="select-style" style="width: 100%; text-align: left;" value="Jugador">
            </div>

            <div id="chat-history" style="height: 140px; overflow-y: auto; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px; text-align: left; font-size: 0.85rem; margin-bottom: 8px;">
                <div><strong style="color: #00A2ED;">AnubiBot:</strong> ¡Bienvenido a Damas! 🎲 Te toca mover primero con las piezas rojas.</div>
            </div>

            <div style="display: flex; gap: 6px;">
                <input type="text" id="chat-input" class="select-style" placeholder="Escribe un mensaje..." style="flex: 1; text-align: left;" onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="btn-reset" style="padding: 4px 10px; margin: 0;">Enviar</button>
            </div>
        </div>
    </div>

    <script src="../js/game-logic.js"></script>
    <script src="../js/checkers-logic.js"></script>
</body>
</html>
